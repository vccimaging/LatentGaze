# Inversion teacher P_T (Sec. 3.1). Released weights: inversion_teacher.pt.
name: inversion_gray
output_dir: runs
seed: 666
init_checkpoint: null
generator: weights/stylegan2_gray256.pkl
gaze_estimator: weights/gaze_estimator_gray.pt

data:
  train_lmdb: data/lmdb/train_combined_lmdb
  test_lmdb: data/lmdb/test_lmdb
  grayscale: true
  normalization: gan
  augment: true
  aug_prob: 0.5
  translate: 16
  aperture: true

model:
  type: teacher
  in_channels: 1
  latent_dim: 256
  num_ws: 14

loss:
  gaze: 1.0
  valid: 1.0e-3
  mse: 1.0
  lpips: 0.2
  gaze_consistency: 0.5

train:
  batch_size: 32
  test_batch_size: 32
  max_iters: 100000
  lr: 1.0e-4
  weight_decay: 3.0e-3
  scheduler: onecycle
  pct_start: 0.01
  num_workers: 8
  log_every: 1000
  eval_every: 2000
  save_every: 10000
