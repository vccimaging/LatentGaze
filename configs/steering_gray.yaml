# Grayscale gaze steering in the P_T latent (Sec. 3.2). Released weights: steering_compact_gray.pt.
name: steering_gray
output_dir: runs
seed: 666
generator: weights/stylegan2_gray256.pkl
inversion: weights/inversion_teacher.pt
gaze_estimator: weights/gaze_estimator_gray.pt

data:
  train_lmdb: data/lmdb/train_combined_lmdb
  test_lmdb: data/lmdb/test_lmdb
  grayscale: true
  normalization: gan
  augment: true
  aug_prob: 0.5
  translate: 16
  aperture: true

model:
  type: compact
  latent_dim: 256
  num_ws: 14

loss:
  perceptual: 0.1
  identity: 0.1
  dino: 0.0

train:
  batch_size: 32
  max_iters: 100000
  lr: 1.0e-4
  weight_decay: 3.0e-3
  scheduler: warmup_plateau_cos
  num_workers: 8
  log_every: 1000
  save_every: 10000
  eval_batches: 20
